<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusCare Authentication</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fbf9f3;color:#1b1c19;font:15px Inter, sans-serif;display:grid;place-items:center;padding:24px}
.shell{width:min(100%,460px);background:#fff;border:1px solid #e4e2dd;border-radius:24px;padding:36px;box-shadow:0 12px 40px #1b1c1912}.brand{display:flex;gap:12px;align-items:center;margin-bottom:28px}.mark{width:44px;height:44px;border-radius:14px;background:#8fbfe3;display:grid;place-items:center;color:#174e6d;font-weight:800;font-size:20px}.brand strong{display:block;letter-spacing:-.03em;font-size:19px}.brand small{color:#41474d}.eyebrow{color:#316383;text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:700}.h{font-size:28px;margin:7px 0 8px;letter-spacing:-.04em}.sub{color:#41474d;margin:0 0 24px;line-height:1.5}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;font-weight:700;color:#41474d}.field input{border:1px solid #c1c7ce;border-radius:12px;padding:12px 13px;background:#fbf9f3;font:inherit;outline:0}.field input:focus{border-color:#316383;box-shadow:0 0 0 3px #8fbfe344}.button{width:100%;border:0;border-radius:12px;padding:13px;background:#8fbfe3;color:#174e6d;font:700 14px Inter;cursor:pointer;margin-top:12px}.button:hover{filter:brightness(.96)}.message{min-height:20px;color:#93000a;background:#ffdad655;border-radius:10px;padding:8px 10px;margin-top:14px;display:none;font-size:13px}.links{text-align:center;color:#41474d;font-size:13px;margin-top:22px}.links a{color:#316383;font-weight:700;text-decoration:none}.portal{float:right;font-size:12px;color:#316383;text-decoration:none;font-weight:600}
</style></head><body><main class="shell"><div class="brand"><div class="mark">CC</div><div><strong>CAMPUSCARE</strong><small>Smart Campus Maintenance</small></div></div>
<a class="portal" id="portal-link"></a><div class="eyebrow" id="portal-label"></div><h1 class="h" id="page-title"></h1><p class="sub" id="page-subtitle"></p>
<form id="auth-form"><div id="registration-fields"><div class="field"><label>Full Name</label><input name="name" autocomplete="name"></div><div class="field"><label>Student ID / Register Number</label><input name="student_id"></div></div><div class="field"><label id="email-label">College Email</label><input type="email" name="email" required autocomplete="email"></div><div class="field"><label>Password</label><input type="password" name="password" required minlength="8" autocomplete="current-password"></div><div class="field" id="confirm-field"><label>Confirm Password</label><input type="password" name="confirm_password" minlength="8" autocomplete="new-password"></div><button class="button" id="submit-label" type="submit"></button><div class="message" id="message"></div></form>
<div class="links" id="footer-links"></div></main><script>const kind="{{AUTH_KIND}}",form=document.getElementById('auth-form'),msg=document.getElementById('message'),reg=document.getElementById('registration-fields'),confirmField=document.getElementById('confirm-field');const title=document.getElementById('page-title'),sub=document.getElementById('page-subtitle'),submit=document.getElementById('submit-label'),portal=document.getElementById('portal-link'),footer=document.getElementById('footer-links');if(kind==='student-register'){title.textContent='Student Registration';sub.textContent='Create your secure student account.';submit.textContent='Register Student';portal.textContent='Admin login';portal.href='/admin-login';footer.innerHTML='Already registered? <a href="/student-login">Student login</a>';}else if(kind==='admin-login'){title.textContent='Admin Login';sub.textContent='Authorized administrators only.';submit.textContent='Admin Login';portal.textContent='Student login';portal.href='/student-login';document.getElementById('portal-label').textContent='Operations portal';reg.remove();confirmField.remove();document.getElementById('email-label').textContent='Admin Email';footer.textContent='Use the administrator account created by the backend setup command.';}else{title.textContent='Student Login';sub.textContent='Sign in to report and track campus maintenance issues.';submit.textContent='Student Login';portal.textContent='Admin login';portal.href='/admin-login';reg.remove();confirmField.remove();footer.innerHTML='New student? <a href="/student-register">Create an account</a>';}document.getElementById('portal-label').textContent=document.getElementById('portal-label').textContent||'Student portal';form.addEventListener('submit',async e=>{e.preventDefault();msg.style.display='none';const body=Object.fromEntries(new FormData(form));const endpoint=kind==='student-register'?'/api/auth/register':'/api/auth/login/'+(kind==='admin-login'?'admin':'student');try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.detail||'Unable to continue.');location.href=d.redirect||(kind==='student-register'?'/student-dashboard':'/');}catch(err){msg.textContent=err.message;msg.style.display='block';}});</script></body></html>

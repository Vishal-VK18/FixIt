<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · CampusCare</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#20211f;background:#f6ebc3}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);padding:32px;background:#fffdf6;border:1px solid #e8dfbd;border-radius:24px;box-shadow:0 18px 55px #34352b18}.brand{font-size:13px;font-weight:800;letter-spacing:.12em;color:#315c78}.brand h1{margin:10px 0 4px;font-size:28px;letter-spacing:-.04em;color:#20211f}.muted{color:#65675f;font-size:14px;line-height:1.5}.modes{display:flex;gap:8px;padding:5px;margin:22px 0;background:#f2f0e8;border-radius:12px}.modes button,.switch{border:0;background:transparent;padding:10px;border-radius:9px;cursor:pointer;color:#51534d;font-weight:650}.modes button.active{background:#8fbfe3;color:#18384f}.field{display:block;margin:14px 0;color:#4d5049;font-size:13px;font-weight:650}.field input{display:block;width:100%;margin-top:7px;padding:12px;border:1px solid #d8d9d1;border-radius:10px;font:inherit;background:white;color:#20211f}.submit{width:100%;margin-top:8px;padding:12px;border:0;border-radius:11px;background:#315c78;color:white;font-weight:750;cursor:pointer}.switch{padding:8px 0;color:#315c78}.error{min-height:20px;color:#9b2e28;font-size:13px;margin-top:10px}.hidden{display:none!important}.notice{padding:11px;border-radius:10px;background:#edf5fa;color:#315c78;font-size:12px;line-height:1.5}
  </style>
</head>
<body data-next="{{NEXT_PATH}}">
  <main class="card">
    <div class="brand">CAMPUSCARE</div>
    <h1 id="heading">Student Login</h1>
    <p class="muted">Sign in to report campus issues and follow your tickets.</p>
    <div class="modes" role="tablist" aria-label="Account type">
      <button id="student-mode" class="active" type="button" onclick="setMode('student')">Student</button>
      <button id="admin-mode" type="button" onclick="setMode('admin')">Admin</button>
    </div>
    <form id="login-form">
      <label class="field">Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
      <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="submit" type="submit">Sign in</button>
    </form>
    <form id="register-form" class="hidden">
      <label class="field">Full name<input name="name" autocomplete="name" required maxlength="120"></label>
      <label class="field">Student email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
      <label class="field">Student ID<input name="student_id" autocomplete="off" required maxlength="80"></label>
      <label class="field">Password (12+ characters)<input name="password" type="password" autocomplete="new-password" minlength="12" required maxlength="256"></label>
      <button class="submit" type="submit">Create student account</button>
    </form>
    <p id="register-toggle" class="muted">New student? <button class="switch" type="button" onclick="showRegistration(true)">Create an account</button></p>
    <p id="admin-note" class="notice hidden">Admin accounts are provisioned by an operator. Public admin registration is disabled.</p>
    <div id="error" class="error" role="alert" aria-live="polite"></div>
  </main>
  <script>
    const nextPath = document.body.dataset.next || "/";
    let mode = "student";
    function setMode(value){mode=value;showRegistration(false);document.getElementById("heading").textContent=value==="admin"?"Admin Login":"Student Login";document.getElementById("student-mode").classList.toggle("active",value==="student");document.getElementById("admin-mode").classList.toggle("active",value==="admin");document.getElementById("register-toggle").classList.toggle("hidden",value!=="student");document.getElementById("admin-note").classList.toggle("hidden",value!=="admin");document.getElementById("error").textContent=""}
    function showRegistration(show){document.getElementById("login-form").classList.toggle("hidden",show);document.getElementById("register-form").classList.toggle("hidden",!show);document.getElementById("register-toggle").innerHTML=show?'Already registered? <button class="switch" type="button" onclick="showRegistration(false)">Sign in</button>':'New student? <button class="switch" type="button" onclick="showRegistration(true)">Create an account</button>';document.getElementById("heading").textContent=show?"Student Registration":"Student Login";document.getElementById("error").textContent=""}
    async function submitAuth(form,event,endpoint){event.preventDefault();const error=document.getElementById("error");const data=Object.fromEntries(new FormData(form));try{const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const result=await response.json();if(!response.ok)throw new Error(result.detail||"Sign in failed.");location.replace(nextPath.startsWith("/")&&!nextPath.startsWith("//")?nextPath:(result.user.role==="admin"?"/maintenance-dashboard":"/"));}catch(err){error.textContent=err.message}}
    document.getElementById("login-form").addEventListener("submit",event=>submitAuth(event.currentTarget,event,`/api/auth/${mode}/login`));
    document.getElementById("register-form").addEventListener("submit",event=>submitAuth(event.currentTarget,event,"/api/auth/register"));
    fetch("/api/auth/me").then(r=>r.ok?r.json():null).then(data=>{if(data)location.replace(data.user.role==="admin"?"/maintenance-dashboard":"/")});
  </script>
</body>
</html>
